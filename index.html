<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiyatro Defteri</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#22201c;--mu:#7a746a;--ac:#8b1e2d;--ac2:#f3e3e5;--bd:#e4ded3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16140f;--card:#211e18;--tx:#f1ece2;--mu:#9d968a;--ac:#e0566a;--ac2:#3a1f25;--bd:#35312a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16140f;--card:#211e18;--tx:#f1ece2;--mu:#9d968a;--ac:#e0566a;--ac2:#3a1f25;--bd:#35312a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 Georgia,'Times New Roman',serif}
main{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;gap:8px;align-items:center;margin-bottom:12px}
#title{flex:1;font:700 24px Georgia,serif;background:transparent;border:0;border-bottom:2px solid var(--bd);color:var(--tx);padding:6px 2px;min-width:0}
#title[readonly]{border-bottom-color:transparent}
button,.btn{font:600 15px system-ui,sans-serif;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 13px}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.tools{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.tools button{padding:4px 10px}
.tag{font:600 12px system-ui,sans-serif;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-right:auto;align-self:center}
textarea,input[type=text]{width:100%;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:110px;resize:vertical}
.txt{white-space:pre-wrap;font-size:19px}
audio{width:100%;margin-top:8px}
.hold{width:100%;padding:22px 12px;font-size:18px;background:var(--ac2);color:var(--ac);border:2px dashed var(--ac);border-radius:14px;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.hold.on{background:var(--ac);color:#fff;border-style:solid}
.note{display:none;margin-top:10px;padding:14px;border-radius:12px;background:var(--ac);color:#fff;white-space:pre-wrap;font-size:19px}
.note.on{display:block}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.add button{flex:1 1 140px}
.mu{color:var(--mu);font:14px system-ui,sans-serif}
.empty{text-align:center;padding:30px 10px}
</style>
</head>
<body>
<main>
<header>
<input id="title" type="text" placeholder="Oyunun adı">
<button id="mode" class="pri"></button>
</header>
<div id="list"></div>
<div id="add" class="add">
<button data-add="text">+ Metin</button>
<button data-add="audio">+ Ses</button>
<button data-add="note">+ Basılı tut notu</button>
</div>
<p class="mu" id="hint"></p>
</main>
<script>
var S={title:"",edit:true,blocks:[]};
var db=null,urls={};
function open(){return new Promise(function(res){try{var r=indexedDB.open("tiyatro",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){db=r.result;res()};r.onerror=function(){res()}}catch(e){res()}})}
function get(k){return new Promise(function(res){if(!db)return res(null);try{var q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}})}
function put(k,v){return new Promise(function(res){if(!db)return res();try{var t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
function del(k){return new Promise(function(res){if(!db)return res();try{var t=db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
var tm;function save(){clearTimeout(tm);tm=setTimeout(function(){put("state",S)},300)}
function h(t,a,k){var e=document.createElement(t);for(var x in a||{}){if(x==="class")e.className=a[x];else if(x.slice(0,2)==="on")e.addEventListener(x.slice(2),a[x]);else e[x]=a[x]}(k||[]).forEach(function(c){e.append(c)});return e}
function move(i,d){var j=i+d;if(j<0||j>=S.blocks.length)return;var b=S.blocks.splice(i,1)[0];S.blocks.splice(j,0,b);save();render()}
function remove(i,btn){var b=S.blocks[i];if(!btn.dataset.sure){btn.dataset.sure=1;btn.textContent="Emin misin?";btn.style.background="var(--ac)";btn.style.color="#fff";setTimeout(function(){btn.dataset.sure="";btn.textContent="Sil";btn.style.background="";btn.style.color=""},3000);return}if(b.audioId){del("a:"+b.audioId);delete urls[b.audioId]}S.blocks.splice(i,1);save();render()}
function audioUrl(b){return get("a:"+b.audioId).then(function(bl){if(!bl)return null;return urls[b.audioId]||(urls[b.audioId]=URL.createObjectURL(bl))})}
var NAMES={text:"Metin",audio:"Ses",note:"Not / ışık"};
function render(){
  document.getElementById("mode").textContent=S.edit?"▶ Oyna":"✎ Düzenle";
  var t=document.getElementById("title");t.value=S.title;t.readOnly=!S.edit;
  document.getElementById("add").style.display=S.edit?"flex":"none";
  document.getElementById("hint").textContent=S.edit?"Düzenleme modu: blok ekle, yaz, ses yükle. Bitince “Oyna”ya bas.":"";
  var L=document.getElementById("list");L.innerHTML="";
  if(!S.blocks.length)L.append(h("div",{class:"card empty mu",textContent:"Henüz bir şey yok. Aşağıdan blok ekle."}));
  S.blocks.forEach(function(b,i){
    var c=h("div",{class:"card"});
    if(S.edit)c.append(h("div",{class:"tools"},[h("span",{class:"tag",textContent:NAMES[b.type]}),h("button",{textContent:"↑",onclick:function(){move(i,-1)}}),h("button",{textContent:"↓",onclick:function(){move(i,1)}}),h("button",{textContent:"Sil",onclick:function(e){remove(i,e.currentTarget)}})]));
    if(b.type==="text"){
      if(S.edit)c.append(h("textarea",{value:b.text||"",placeholder:"Metni yaz…",oninput:function(e){b.text=e.target.value;save()}}));
      else c.append(h("div",{class:"txt",textContent:b.text||""}));
    }
    if(b.type==="audio"){
      if(S.edit){
        c.append(h("input",{type:"text",value:b.label||"",placeholder:"Ses adı (örn. Sahne 2 diyalog)",oninput:function(e){b.label=e.target.value;save()}}));
        c.append(h("input",{type:"file",accept:"audio/*",style:"margin-top:8px;width:100%",onchange:function(e){var f=e.target.files[0];if(!f)return;var id=b.audioId||("x"+Date.now()+Math.floor(Math.random()*1e5));if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}b.audioId=id;b.audioName=f.name;if(!b.label)b.label=f.name;put("a:"+id,f).then(function(){save();render()})}}));
      }else if(b.label)c.append(h("div",{class:"tag",textContent:b.label,style:"display:block"}));
      if(b.audioId){var a=h("audio",{controls:true,preload:"metadata"});c.append(a);audioUrl(b).then(function(u){if(u)a.src=u})}
      else c.append(h("div",{class:"mu",textContent:"Ses yüklenmedi."}));
    }
    if(b.type==="note"){
      if(S.edit){
        c.append(h("input",{type:"text",value:b.label||"",placeholder:"Buton adı (örn. Işık 3)",oninput:function(e){b.label=e.target.value;save()}}));
        c.append(h("textarea",{value:b.text||"",placeholder:"Basılı tutunca görünecek not…",style:"margin-top:8px",oninput:function(e){b.text=e.target.value;save()}}));
      }else{
        var n=h("div",{class:"note",textContent:b.text||""});
        var btn=h("button",{class:"hold",textContent:"👆 "+(b.label||"Notu görmek için basılı tut")});
        var on=function(){btn.classList.add("on");n.classList.add("on")};
        var off=function(){btn.classList.remove("on");n.classList.remove("on")};
        btn.addEventListener("pointerdown",function(e){e.preventDefault();on()});
        ["pointerup","pointerleave","pointercancel"].forEach(function(ev){btn.addEventListener(ev,off)});
        btn.addEventListener("contextmenu",function(e){e.preventDefault()});
        c.append(btn,n);
      }
    }
    L.append(c);
  });
}
document.getElementById("mode").onclick=function(){S.edit=!S.edit;save();render();window.scrollTo(0,0)};
document.getElementById("title").oninput=function(e){S.title=e.target.value;save()};
document.querySelectorAll("[data-add]").forEach(function(b){b.onclick=function(){S.blocks.push({id:Date.now(),type:b.dataset.add,text:"",label:""});save();render();window.scrollTo(0,document.body.scrollHeight)}});
open().then(function(){return get("state")}).then(function(s){if(s)S=s;render()});
</script>
</body>
</html>
