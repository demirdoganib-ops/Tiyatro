<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f0f0f0">
<title>Tiyatro Defteri</title>
<style>
:root{--gap:14px;--lh:1.4;--al:left;--fs:22px;--tx:#222222;--bg:#f0f0f0;--or:#fb8c1c;--bl:#3fa9ff;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
#page{padding:calc(60px + env(safe-area-inset-top,0px)) 16px 140px}
body.edit #page{padding-top:calc(155px + env(safe-area-inset-top,0px))}
#stage{position:relative;max-width:760px;margin:0 auto;min-height:60vh}
.line{margin:0 0 var(--gap);min-height:1.4em;font-size:var(--fs);font-weight:600;line-height:var(--lh);text-align:var(--al);white-space:pre-wrap;word-break:break-word;color:var(--tx)}
.row{display:flex;gap:6px;align-items:flex-start;margin:0 0 var(--gap)}
.row textarea{flex:1;min-width:0;font:600 var(--fs)/var(--lh) system-ui,sans-serif;text-align:var(--al);color:var(--tx);background:rgba(255,255,255,.55);border:1px dashed #aaa;border-radius:8px;padding:6px 8px;resize:none;overflow:hidden}
.mini{display:flex;flex-direction:column;gap:4px}
.mini button{width:34px;height:30px;font:600 14px system-ui;border:1px solid #ccc;border-radius:8px;background:#fff;padding:0}
.mini .hd{touch-action:none;background:#eee}
.hint{color:#888;font-size:16px;padding:10px 0}
#ctl{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:20}
#ctl button{font:600 15px system-ui;border:1px solid #ccc;background:#fff;color:#111;border-radius:10px;padding:9px 12px}
#ctl #mn{width:34px;height:34px;padding:0;border-radius:50%;opacity:.65;font-size:17px}
#menu{display:none;flex-direction:column;gap:6px;align-items:flex-start}
#menu.on{display:flex}
#addbox{position:fixed;top:0;right:0;z-index:20;display:none;flex-direction:column;gap:8px;border-left:6px solid var(--or);border-bottom:6px solid var(--or);background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 10px 8px 12px}
body.edit #addbox{display:flex}
#addbox button{display:flex;align-items:center;gap:8px;background:none;border:0;font:500 20px system-ui;color:#000;padding:0}
#addbox i{display:inline-flex;width:36px;height:36px;background:var(--or);align-items:center;justify-content:center;font:700 28px/1 system-ui;font-style:normal;color:#000}
.dot{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 18px system-ui;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.a{width:58px;height:58px;background:var(--bl)}
.n{width:42px;height:42px;background:var(--or)}
.a.pl{outline:5px solid rgba(63,169,255,.4)}
#nv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,520px);max-height:70vh;overflow:auto;background:#fff;color:#111;border:4px solid var(--or);border-radius:14px;padding:18px;font:600 calc(var(--fs) + 2px)/1.4 system-ui;white-space:pre-wrap;z-index:50;display:none;pointer-events:none}
#nv.on{display:block}
#nv.pin{pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;color:#111;border-top:4px solid var(--or);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:none;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}
#sheet.on{display:flex}
#sheet textarea{font:16px system-ui;width:100%;min-height:120px;padding:10px;border:1px solid #ccc;border-radius:8px}
#sheet button{font:600 16px system-ui;padding:11px;border-radius:10px;border:1px solid #ccc;background:#f6f6f6;color:#111}
#sheet button.p{background:var(--or);border-color:var(--or);color:#000}
#sheet h3{margin:0;font:700 17px system-ui}
#sheet label{font:15px system-ui;display:flex;justify-content:space-between;align-items:center;gap:10px}
#sheet input[type=color]{width:60px;height:36px;border:0;padding:0;background:none}
</style>
</head>
<body>
<div id="ctl"><button id="mn">☰</button><div id="menu"><button id="mode"></button><button id="set">⚙ Ayarlar</button><button id="exp">⬇ Projeyi indir</button><button id="imp">⬆ Proje yükle</button><button id="fs">⛶ Tam ekran</button></div></div>
<div id="addbox">
<button data-add="text"><i>+</i>Metin</button>
<button data-add="audio"><i>+</i>Ses</button>
<button data-add="note"><i>+</i>Not</button>
</div>
<div id="page"><div id="stage"></div></div>
<div id="nv"></div>
<div id="sheet"></div>
<script>
var S={mode:"edit",size:22,color:"#222222",bg:"#f0f0f0",align:"left",gap:14,lh:1.4,items:[]};
var EDIT=true,mem={};
var db=null,urls={},cur=null,curId=null,pinned=false;
function openDb(){return new Promise(function(res){try{var r=indexedDB.open("tiyatro2",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){db=r.result;res()};r.onerror=function(){res()}}catch(e){res()}})}
function get(k){return new Promise(function(res){if(!db)return res(null);try{var q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}})}
function put(k,v){return new Promise(function(res){if(!db)return res();try{var t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
function del(k){return new Promise(function(res){if(!db)return res();try{var t=db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
var tm;function save(){clearTimeout(tm);tm=setTimeout(function(){put(EDIT?"s2":"vset",EDIT?S:{size:S.size,color:S.color,bg:S.bg,align:S.align,gap:S.gap,lh:S.lh})},300)}
function h(t,a,k){var e=document.createElement(t);for(var x in a||{}){if(x==="class")e.className=a[x];else if(x.slice(0,2)==="on")e.addEventListener(x.slice(2),a[x]);else e[x]=a[x]}(k||[]).forEach(function(c){e.append(c)});return e}
function $(i){return document.getElementById(i)}
function sure(btn,fn,msg){if(!btn.dataset.s){btn.dataset.s=1;var o=btn.textContent;btn.textContent=msg;setTimeout(function(){delete btn.dataset.s;btn.textContent=o},3000);return}fn()}
function sz(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function apply(){var r=document.documentElement.style;r.setProperty("--fs",S.size+"px");r.setProperty("--tx",S.color);r.setProperty("--bg",S.bg);r.setProperty("--gap",S.gap+"px");r.setProperty("--lh",S.lh);r.setProperty("--al",S.align);document.body.className=S.mode;$("mode").textContent=S.mode==="edit"?"▶ Oyna":"✎ Düzenle"}
function fit(){var m=0;S.items.forEach(function(it){if(it.type!=="text"&&it.y>m)m=it.y});$("stage").style.minHeight=Math.max(window.innerHeight*0.6,m+120)+"px"}
function lab(e){var it=e._it;if(!it||it.type!=="audio")return;e.textContent=!it.audioId?"+":(curId===it.id?"■":"▶");e.classList.toggle("pl",curId===it.id)}
function audioUrl(it){if(mem[it.id])return Promise.resolve(urls[it.id]||(urls[it.id]=URL.createObjectURL(mem[it.id])));return get("a:"+it.id).then(function(b){if(!b)return null;return urls[it.id]||(urls[it.id]=URL.createObjectURL(b))})}
function stopAudio(){if(cur){cur.pause();cur=null}curId=null;document.querySelectorAll(".a").forEach(lab)}
function playAudio(it){if(curId===it.id){stopAudio();return}stopAudio();audioUrl(it).then(function(u){if(!u)return;var a=new Audio(u);cur=a;curId=it.id;a.onended=function(){if(cur===a)stopAudio()};a.play().catch(function(){stopAudio()});document.querySelectorAll(".a").forEach(lab)})}
function pick(it){var f=document.createElement("input");f.type="file";f.accept="audio/*";f.onchange=function(){var file=f.files[0];if(!file)return;if(urls[it.id]){URL.revokeObjectURL(urls[it.id]);delete urls[it.id]}if(curId===it.id)stopAudio();put("a:"+it.id,file).then(function(){it.audioId=true;it.name=file.name;save();render();if($("sheet").className==="on")openSheet(it)})};f.click()}
function showNote(it,pin){var n=$("nv");n.textContent=it.text||"(not boş)";n.className="on"+(pin?" pin":"");pinned=!!pin}
function hideNote(){$("nv").className="";pinned=false}
$("nv").onclick=hideNote;
function closeSheet(){$("sheet").className=""}
function removeItem(it){if(it.type==="audio"){if(curId===it.id)stopAudio();del("a:"+it.id);delete urls[it.id]}S.items.splice(S.items.indexOf(it),1);closeSheet();save();render()}
function openSheet(it){var s=$("sheet");s.innerHTML="";s.append(h("h3",{textContent:it.type==="audio"?"Ses":"Not"}));
 if(it.type==="audio"){s.append(h("div",{textContent:it.audioId?("Dosya: "+(it.name||"")):"Henüz ses dosyası yok"}));s.append(h("button",{class:"p",textContent:it.audioId?"Dosyayı değiştir":"Ses dosyası seç",onclick:function(){pick(it)}}));if(it.audioId)s.append(h("button",{textContent:"▶ Dinle / Durdur",onclick:function(){playAudio(it)}}))}
 else s.append(h("textarea",{value:it.text||"",placeholder:"Not metni…",oninput:function(e){it.text=e.target.value;save()}}));
 s.append(h("button",{textContent:"Sil",onclick:function(e){sure(e.currentTarget,function(){removeItem(it)},"Emin misin?")}}));
 s.append(h("button",{textContent:"Tamam",onclick:closeSheet}));s.className="on"}
function openSettings(){var s=$("sheet");s.innerHTML="";s.append(h("h3",{textContent:"Ayarlar"}));
 var v=h("b",{textContent:S.size+" px"});
 s.append(h("label",{},["Yazı boyutu (hepsi)",v]));
 s.append(h("input",{type:"range",min:14,max:48,value:S.size,oninput:function(e){S.size=+e.target.value;v.textContent=S.size+" px";apply();document.querySelectorAll("#stage textarea").forEach(sz);save()}}));
 s.append(h("label",{},["Yazı hizalama"]));
 var ab=h("div",{style:"display:flex;gap:6px"}),av=["left","center","right"];
 function paint(){Array.prototype.forEach.call(ab.children,function(b,k){b.className=S.align===av[k]?"p":""})}
 ["Sola","Ortala","Sağa"].forEach(function(n,k){ab.append(h("button",{textContent:n,style:"flex:1",onclick:function(){S.align=av[k];apply();save();paint()}}))});
 paint();s.append(ab);
 var g=h("b",{textContent:S.gap+" px"}),l=h("b",{textContent:S.lh});
 s.append(h("label",{},["Metinler arası boşluk",g]));
 s.append(h("input",{type:"range",min:0,max:60,value:S.gap,oninput:function(e){S.gap=+e.target.value;g.textContent=S.gap+" px";apply();save()}}));
 s.append(h("label",{},["Satır aralığı",l]));
 s.append(h("input",{type:"range",min:1,max:2.4,step:0.1,value:S.lh,oninput:function(e){S.lh=+e.target.value;l.textContent=S.lh;apply();document.querySelectorAll("#stage textarea").forEach(sz);save()}}));
 s.append(h("label",{},["Yazı rengi",h("input",{type:"color",value:S.color,oninput:function(e){S.color=e.target.value;apply();save()}})]));
 s.append(h("label",{},["Arka plan rengi",h("input",{type:"color",value:S.bg,oninput:function(e){S.bg=e.target.value;apply();save()}})]));
 s.append(h("button",{class:"p",textContent:"Tamam",onclick:closeSheet}));s.className="on"}
function tap(it,el){
 if(S.mode==="edit"){openSheet(it);return}
 if(it.type==="audio"){if(!it.audioId){if(EDIT)pick(it)}else playAudio(it);return}
 var n=Date.now();if(n-(el._lt||0)<350){el._lt=0;showNote(it,true)}else el._lt=n}
function attach(el,it){var sx,sy,ox,oy,mv=false,held=false,t,down=false,size=it.type==="audio"?58:42;
 el.addEventListener("pointerdown",function(e){down=true;mv=false;held=false;sx=e.clientX;sy=e.clientY;ox=it.x;oy=it.y;try{el.setPointerCapture(e.pointerId)}catch(x){}
  if(it.type==="note"&&S.mode==="play"&&it.text){t=setTimeout(function(){if(!mv){held=true;showNote(it,false)}},350)}});
 el.addEventListener("pointermove",function(e){if(!down||!EDIT)return;var dx=e.clientX-sx,dy=e.clientY-sy;
  if(!mv&&Math.hypot(dx,dy)>8){mv=true;clearTimeout(t);if(held){held=false;if(!pinned)hideNote()}}
  if(mv){it.x=Math.max(0,Math.min($("stage").clientWidth-size,ox+dx));it.y=Math.max(0,oy+dy);el.style.left=it.x+"px";el.style.top=it.y+"px"}});
 function end(c){if(!down)return;down=false;clearTimeout(t);if(mv){save();fit();return}if(held){if(!pinned)hideNote();return}if(!c)tap(it,el)}
 el.addEventListener("pointerup",function(){end(false)});
 el.addEventListener("pointercancel",function(){end(true)});
 el.addEventListener("contextmenu",function(e){e.preventDefault()})}
function handle(it,getRow){var b=h("button",{class:"hd",textContent:"↕"});var sy,m0,dn=false;
 b.addEventListener("pointerdown",function(e){dn=true;sy=e.clientY;m0=it.mt||0;try{b.setPointerCapture(e.pointerId)}catch(x){}});
 b.addEventListener("pointermove",function(e){if(!dn)return;it.mt=Math.max(0,Math.min(400,Math.round(m0+e.clientY-sy)));getRow().style.marginTop=it.mt+"px"});
 function up(){if(dn){dn=false;save();fit()}}
 b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);return b}
function moveText(i,d){var j=i+d;while(j>=0&&j<S.items.length&&S.items[j].type!=="text")j+=d;if(j<0||j>=S.items.length)return;var t=S.items[i];S.items[i]=S.items[j];S.items[j]=t;save();render()}
function render(){apply();var st=$("stage");st.innerHTML="";var edit=S.mode==="edit",tas=[],w=st.clientWidth||300;
 if(!S.items.length)st.append(h("div",{class:"hint",textContent:edit?"Sağ üstten + Metin / + Ses / + Not ekle.":"Henüz yayınlanmış proje yok."}));
 S.items.forEach(function(it,i){
  if(it.type==="text"){
   if(edit){var ta=h("textarea",{value:it.text||"",placeholder:"Metin…",rows:1,oninput:function(e){it.text=e.target.value;sz(e.target);save()}});tas.push(ta);
    var rw=h("div",{class:"row"},[ta,h("div",{class:"mini"},[handle(it,function(){return rw}),h("button",{textContent:"↑",onclick:function(){moveText(i,-1)}}),h("button",{textContent:"↓",onclick:function(){moveText(i,1)}}),h("button",{textContent:"✕",onclick:function(e){sure(e.currentTarget,function(){S.items.splice(S.items.indexOf(it),1);save();render()},"Sil?")}})])]);rw.style.marginTop=(it.mt||0)+"px";st.append(rw)}
   else{var ln=h("div",{class:"line",textContent:it.text||""});ln.style.marginTop=(it.mt||0)+"px";st.append(ln)}
  }else{var size=it.type==="audio"?58:42;var d=h("div",{class:"dot "+(it.type==="audio"?"a":"n")});d._it=it;
   d.style.left=Math.max(0,Math.min(it.x,w-size))+"px";d.style.top=it.y+"px";lab(d);attach(d,it);st.append(d)}
 });
 tas.forEach(sz);fit()}
function add(type){var st=$("stage");var it={id:"i"+Date.now()+Math.floor(Math.random()*1e4),type:type,text:""};
 if(type!=="text"){it.x=Math.min(30+(S.items.length%5)*20,Math.max(0,st.clientWidth-60));it.y=Math.max(0,window.scrollY+220-st.offsetTop)}
 S.items.push(it);save();render();
 if(type==="audio")pick(it);
 if(type==="text"){var tas=document.querySelectorAll("#stage textarea");var l=tas[tas.length-1];if(l){l.focus();l.scrollIntoView({block:"center"})}}}
document.querySelectorAll("[data-add]").forEach(function(b){b.onclick=function(){add(b.dataset.add)}});
$("mode").onclick=function(){S.mode=S.mode==="edit"?"play":"edit";closeSheet();hideNote();$("menu").classList.remove("on");save();render();window.scrollTo(0,0)};
$("set").onclick=function(){$("menu").classList.remove("on");openSettings()};
$("mn").onclick=function(){$("menu").classList.toggle("on")};
document.addEventListener("pointerdown",function(e){if(!$("ctl").contains(e.target))$("menu").classList.remove("on")});
$("fs").onclick=function(){var d=document.documentElement;$("menu").classList.remove("on");try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else if(d.requestFullscreen){d.requestFullscreen()}else if(d.webkitRequestFullscreen){d.webkitRequestFullscreen()}else{alert("Bu tarayıcı tam ekranı desteklemiyor. Tarayıcı menüsünden Ana ekrana ekle yap.")}}catch(x){}};
window.addEventListener("resize",fit);
function b64(b){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(f.result)};f.readAsDataURL(b)})}
function unb64(d){return fetch(d).then(function(r){return r.blob()})}
$("exp").onclick=function(){$("menu").classList.remove("on");var A={};
 Promise.all(S.items.filter(function(i){return i.type==="audio"&&i.audioId}).map(function(it){return get("a:"+it.id).then(function(b){if(b)return b64(b).then(function(d){A[it.id]=d})})})).then(function(){
  var j=JSON.stringify({v:Date.now(),s:{size:S.size,color:S.color,bg:S.bg,align:S.align,gap:S.gap,lh:S.lh,items:S.items},a:A});
  var u=URL.createObjectURL(new Blob([j],{type:"application/json"}));var a=document.createElement("a");a.href=u;a.download="proje.json";document.body.append(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},5000)})};
$("imp").onclick=function(){$("menu").classList.remove("on");var f=document.createElement("input");f.type="file";f.accept=".json,application/json";
 f.onchange=function(){var fl=f.files[0];if(!fl)return;fl.text().then(function(t){var p=JSON.parse(t);S=Object.assign(S,p.s,{mode:"edit"});return Promise.all(Object.keys(p.a||{}).map(function(id){return unb64(p.a[id]).then(function(b){return put("a:"+id,b)})}))}).then(function(){urls={};save();render()}).catch(function(){alert("Dosya okunamadı")})};f.click()};
if(!EDIT){["mode","imp","exp"].forEach(function(i){$(i).style.display="none"})}
openDb().then(function(){
 if(EDIT)return get("s2").then(function(s){if(s)S=Object.assign({},S,s);render()});
 S.mode="play";
 return fetch("proje.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(p){S=Object.assign(S,p.s,{mode:"play"});return Promise.all(Object.keys(p.a||{}).map(function(id){return unb64(p.a[id]).then(function(b){mem[id]=b})}))}).catch(function(){}).then(function(){return get("vset")}).then(function(v){if(v)Object.assign(S,v,{mode:"play"});render()})
});
</script>
</body>
</html>
